name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # The real acceptance run: every suite, on every OS, on the oldest and newest
  # Python we claim to support. A green badge here means the tool actually works,
  # not that a linter liked it.
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show the interpreter
        run: python -c "import sys, sqlite3; print(sys.version); print('sqlite', sqlite3.sqlite_version)"

      - name: doctor (self-check must pass on a fresh clone)
        run: python bin/recall.py doctor

      - name: P0 — layout, self-check, index basics
        run: python tests/test_p0.py

      - name: P1 — import, update, rename, failure, rebuild
        run: python tests/test_p1.py

      - name: P2 — retrieval, fuzzy matching, aliases, budget, heading search
        run: python tests/test_p2.py

      - name: P3 — transcript archiving, multi-frame zstd, failure recording
        run: python tests/test_p3.py

      - name: P4 — artifact assembly, citation verification, long-term memory
        run: python tests/test_p4.py

      - name: P5 — zero-setup search and Skill installation
        run: python tests/test_p5.py

      - name: install.sh must be pure LF and install.ps1 must carry a UTF-8 BOM
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sys
          sh = pathlib.Path("install.sh").read_bytes()
          if b"\r" in sh:
              print("::error::install.sh contains CR — /bin/sh will fail with "
                    "'\\r': not found")
              sys.exit(1)
          ps1 = pathlib.Path("install.ps1").read_bytes()
          if not ps1.startswith(b"\xef\xbb\xbf"):
              print("::error::install.ps1 has no UTF-8 BOM — PowerShell 5.1 decodes "
                    "it as ANSI and non-ASCII text will be garbled")
              sys.exit(1)
          print("ok: install.sh is LF-only, install.ps1 has a BOM")
          PY

      - name: The bundled pinyin table must load and be complete
        run: |
          python - <<'PY'
          from brain.core import pinyin
          assert pinyin.available(), "brain/data/pinyin.tsv.gz is missing or unreadable"
          n = len(pinyin.table())
          assert n > 20000, f"pinyin table looks truncated: {n} entries"
          assert pinyin.to_pinyin("通货膨胀") == "tonghuopengzhang"
          # Homophones must collapse to one string — that is the whole basis of
          # homophone-tolerant search.
          assert pinyin.to_pinyin("直接税") == pinyin.to_pinyin("直接水")
          print(f"ok: {n} characters, projection and homophones verified")
          PY

  # ---------------------------------------------------------------------------
  # The headline promise is "no dependencies". Assert it from the source instead
  # of trusting the README: import every module with a stripped sys.path and fail
  # on anything that is not stdlib (or a documented optional import).
  # ---------------------------------------------------------------------------
  stdlib-only:
    name: no third-party imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fail if any module imports something outside the stdlib
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          # Importable without any install. `zstandard` and `pypdf` are optional
          # and must be wrapped in try/except by the code that uses them.
          OPTIONAL = {"zstandard", "pypdf"}
          STDLIB = set(sys.stdlib_module_names)
          LOCAL = {"brain"}

          offenders = []
          for path in sorted(pathlib.Path("brain").rglob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:            # relative import
                          continue
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if not name or name in STDLIB or name in LOCAL or name in OPTIONAL:
                          continue
                      offenders.append(f"{path}:{node.lineno}: {name}")

          if offenders:
              print("third-party imports found:")
              print("\n".join(offenders))
              sys.exit(1)
          print("ok: brain/ imports nothing outside the standard library")
          PY

  # ---------------------------------------------------------------------------
  # The installers are real code too. Run them for real, but never let them touch
  # the runner's PATH — that is exactly the side effect they are cautious about.
  # ---------------------------------------------------------------------------
  install:
    name: install.sh / install.ps1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install.sh
        if: runner.os != 'Windows'
        run: sh -n install.sh && bash install.sh --bin-dir "$RUNNER_TEMP/bin" --skip-doctor

      - name: install.sh must be pure LF (CR would break /bin/sh)
        if: runner.os != 'Windows'
        run: |
          if grep -q $'\r' install.sh; then
            echo "install.sh contains CR characters" >&2
            exit 1
          fi
          echo "ok: install.sh is LF-only"

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -BinDir "$env:RUNNER_TEMP\bin" -SkipDoctor
          & "$env:RUNNER_TEMP\bin\recall.cmd" --version

  # ---------------------------------------------------------------------------
  # "Clone and run" only holds if nothing in the repo is tied to the author's
  # machine. A hard-coded home directory in the docs is enough to send a new
  # user chasing a path that does not exist on their disk.
  # ---------------------------------------------------------------------------
  portable:
    name: no author-specific paths in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on absolute home paths or the author's name
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys

          # Only look at files git actually tracks.
          tracked = subprocess.run(["git", "ls-files"], capture_output=True,
                                   text=True, check=True).stdout.split()
          # An absolute home directory **with a real user name after it**.
          # The negative lookahead lets documented placeholders through —
          # `C:\Users\<you>`, `%USERPROFILE%`, `$HOME` are instructions, not
          # leaks, and flagging them would train people to ignore this check.
          # No personal name is baked in here: this file ships publicly.
          BAD = re.compile(r"[Cc]:\\Users\\(?!<|\{|%|\$)[A-Za-z0-9_.\-]"
                           r"|/Users/[A-Za-z]|/home/[A-Za-z]")

          # docs/ is excluded on purpose: those are historical design notes
          # written on one machine. They are records, not instructions, and
          # docs/README.md says so.
          SKIP_PREFIXES = ("docs/",)

          offenders = []
          for name in tracked:
              if name.startswith(SKIP_PREFIXES):
                  continue
              p = pathlib.Path(name)
              if p.suffix.lower() in {".gz", ".png", ".jpg", ".zip", ".whl"}:
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for i, line in enumerate(text.splitlines(), 1):
                  if BAD.search(line):
                      offenders.append(f"{name}:{i}: {line.strip()[:110]}")

          if offenders:
              print("author-specific content found in tracked files:")
              print("\n".join(offenders))
              print()
              print("If this is a genuinely machine-local note, mark it clearly as "
                    "such — the shipped docs must work on a fresh machine.")
              sys.exit(1)
          print("ok: no author-specific paths in any tracked file")
          PY

  # ---------------------------------------------------------------------------
  # A wrong .gitignore is a data-leak bug: it would push the user's notes.
  # ---------------------------------------------------------------------------
  gitignore:
    name: derived and personal data stay out of git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: git check-ignore
        run: |
          set -e
          mkdir -p index cache artifacts data/memory state aliases.json
          touch index/recall.db cache/x.json artifacts/out.md \
                data/memory/x.md state/sources.json aliases.json/keep
          for p in index/recall.db cache/x.json artifacts/out.md \
                   data/memory/x.md state/sources.json; do
            if git check-ignore -q "$p"; then
              echo "ok: $p is ignored"
            else
              echo "::error::$p must be ignored — it may contain personal data"
              exit 1
            fi
          done
          for p in README.md LICENSE CHANGELOG.md CONTRIBUTING.md install.sh \
                   install.ps1 bin/recall.py brain/config.py brain/core/pinyin.py \
                   brain/data/pinyin.tsv.gz tools/build_pinyin_table.py \
                   .github/workflows/ci.yml; do
            if git check-ignore -q "$p"; then
              echo "::error::$p must NOT be ignored"
              exit 1
            fi
            echo "ok: $p is tracked"
          done
